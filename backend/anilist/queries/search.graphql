query ($id: Int) {
  Media(id: $id, type: ANIME) {
    id
    title {
      romaji
      english
      native
    }
    format
    status
    episodes
    duration
    startDate {
      year
    }
    coverImage {
      large
      medium
    }
    isAdult
    siteUrl
    description(asHtml: false)
  }
}