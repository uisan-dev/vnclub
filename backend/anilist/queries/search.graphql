query ($search: String, $perPage: Int) {
  Page(perPage: $perPage) {
    media(search: $search, type: ANIME, sort: SEARCH_MATCH) {
      id
      title {
        romaji
        english
        native
      }
      format
      status
      episodes
      duration
      startDate {
        year
      }
      coverImage {
        large
        medium
      }
      isAdult
      siteUrl
      description(asHtml: false)
    }
  }
}